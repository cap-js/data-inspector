# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: sap.cap.datainspector.datainspectorui
type: application
framework:
  name: OpenUI5
  version: "1.138.0"
  libraries:
    - name: sap.ui.core
    - name: themelib_sap_horizon
    - name: sap.f
    - name: sap.m
    - name: sap.uxap
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        # Forward OData requests to the locally running CAP server so the UI can
        # be developed standalone via `ui5 serve` (see the project README).
        backend:
          - path: /odata
            url: http://localhost:4004
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sapui5.hana.ondemand.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
